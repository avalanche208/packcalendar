name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packcalendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and calendar behavior
        run: |
          node --check site/app.js
          node --check site/events.js
          node --test test/events.test.js
      - name: Build and validate nginx
        run: |
          docker build -t packcalendar:test .
          docker run --rm packcalendar:test nginx -t
          docker run -d --name packcalendar-test -p 8080:80 packcalendar:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/ | grep -q 'Pack 77 Calendar'
      - name: Verify live rehosted feed and cache
        run: |
          curl --fail --retry 2 --retry-delay 3 --max-time 60 -sS -D /tmp/feed-headers http://localhost:8080/calendar.ics -o /tmp/calendar.ics
          grep -q '^BEGIN:VCALENDAR' /tmp/calendar.ics
          grep -q '^X-WR-CALNAME:Cub Scout Pack 77' /tmp/calendar.ics
          curl --fail --silent -D /tmp/cache-headers http://localhost:8080/calendar.ics -o /tmp/calendar-cached.ics
          grep -qi 'X-Calendar-Cache: HIT' /tmp/cache-headers
          cmp /tmp/calendar.ics /tmp/calendar-cached.ics
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {parseFeed,expandFeed} from './site/events.js'; const f=parseFeed(readFileSync('/tmp/calendar.ics','utf8')); expandFeed(f,new Date(),new Date(Date.now()+90*86400000)); console.log('Live feed parsed successfully');"
      - name: Show container logs
        if: failure()
        run: docker logs packcalendar-test || true
      - name: Stop test container
        if: always()
        run: docker rm -f packcalendar-test || true
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Docker Hub credentials
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo '::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (or DOCKER_USERNAME and DOCKER_PASSWORD). The token needs write access to avalanche208/packcalendar.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      - id: version
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            avalanche208/packcalendar:latest
            avalanche208/packcalendar:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.title=PackCalendar
            org.opencontainers.image.source=https://github.com/avalanche208/packcalendar
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
