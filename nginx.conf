proxy_cache_path /var/cache/nginx/calendar levels=1:2 keys_zone=calendar:1m max_size=20m inactive=7d use_temp_path=off;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /calendar.ics {
        set $calendar_host calendar.google.com;
        proxy_pass https://$calendar_host/calendar/ical/s3ijfped1qod4lkan99kmsneic%40group.calendar.google.com/public/basic.ics;
        proxy_ssl_server_name on;
        proxy_ssl_name calendar.google.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host calendar.google.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_cache calendar;
        proxy_cache_key pack77-public-calendar;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Expires Cache-Control Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Content-Disposition;
        add_header Cache-Control "public, max-age=60" always;
        add_header Content-Disposition 'inline; filename="pack77-calendar.ics"';
        add_header X-Calendar-Cache $upstream_cache_status always;
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
